
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Little Dream</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <div class="decor decor-one">✦</div>
        <div class="decor decor-two">♡</div>
        <div class="decor decor-three">✧</div>

        <section class="signup-card">

            <header class="top-bar">
                <div class="window-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <p>little-dream.net</p>
                <span class="heart">♥</span>
            </header>

            <div class="card-content">

                <div class="sticker">୨୧</div>

                <h1>Formulário de Cadastro</h1>

                <p class="subtitle">
                    Crie sua conta e entre<br>
                    no nosso mundinho 
                </p>

                <form action="#" method="post">

                    <div class="input-group">
                        <label for="nome">Seu nome</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Como podemos te chamar?"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="email">Seu e-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@exemplo.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="senha">Sua senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="confirmar-senha">
                            Confirme sua senha
                        </label>
                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <label class="terms">
                        <input type="checkbox" name="termos" required>
                        <span>Li e aceito os termos de uso </span>
                    </label>

                    <button type="submit" class="signup-button">
                        Criar minha conta 
                    </button>

                </form>

                <p class="login-link">
                    Já tem uma conta?
                    <a href="#">Fazer login</a>
                </p>

                <div class="bottom-decoration">
                    <span>♡</span>
                    <span>✧</span>
                    <span>୨୧</span>
                    <span>✧</span>
                    <span>♡</span>
                </div>

            </div>
        </section>

    </main>

</body>
</html>
